# SPDX-License-Identifier: Apache-2.0
#
# Weekly, REPORT-ONLY: build and test this driver against Zephyr `main`.
#
# ci.yml (Zephyr v4.4.1, west.yml's pin) stays the release gate. This job exists so
# that we, not a reviewer who builds against `main`, are first to see upstream
# changes to Zephyr's virtio base break the driver. It deliberately has no
# pull_request or push trigger: `main` moves, and a PR made red by upstream churn
# would teach everyone to ignore red.
#
# Pass = twister exited 0 AND the expected number of configurations / test cases
# ran and passed (.github/scripts/twister_gate.py reads twister.json; zero tests
# is a failure). Expected counts must be updated when tests/ changes.
#
# On a failed SCHEDULED run one tracking issue is opened (or commented on), and
# closed on the next pass. GitHub disables scheduled workflows after 60 days with
# no repository activity: re-enable under Actions > "zephyr main weekly" >
# "Enable workflow".
name: zephyr main weekly
on:
  schedule:
    - cron: "43 4 * * 3"   # Wednesdays 04:43 UTC, off-peak, off the hour
  workflow_dispatch:
    inputs:
      zephyr_rev:
        description: "Zephyr ref to test (default: main)"
        default: main
  push:
    branches: [ci/zephyr-main-weekly]   # TEMP
permissions:
  contents: read
env:
  ZREV: ${{ inputs.zephyr_rev || 'main' }}
  OUT: ${{ github.workspace }}/ci-out
  EXPECT_TEST_CONFIGS: "3"    # tests/drivers/can/virtio: base, fd, no_rtr
  EXPECT_TEST_CASES: "40"
  EXPECT_SAMPLE_CONFIGS: "1"  # samples/xenvm_selftest, build only
jobs:
  main:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: zephyr-main-weekly-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zephyr-virtio-can
          persist-credentials: false
      - name: Host packages
        run: |
          mkdir -p "$OUT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ninja-build gperf device-tree-compiler \
            qemu-system-arm python3-venv xz-utils
      - name: West workspace (Zephyr main)
        run: |
          python3 -m venv .venv && . .venv/bin/activate
          pip install -q west
          # Same manifest, Zephyr's revision overridden (main unless dispatched with another ref) for this job only; west.yml is untouched.
          sed "s|revision: 1f6485eca25431b5ff27ce9a754218c9e559bbbb.*|revision: $ZREV|" \
            zephyr-virtio-can/west.yml > zephyr-virtio-can/west-main.yml
          grep -q "^ *revision: $ZREV\$" zephyr-virtio-can/west-main.yml || { echo "::error::revision override did not apply"; exit 1; }
          west init -l --mf west-main.yml zephyr-virtio-can
          west update --narrow -o=--depth=1
          SHA=$(git -C zephyr rev-parse HEAD)
          echo "$SHA" > "$OUT/sha.txt"
          echo "Zephyr $ZREV: $SHA ($(git -C zephyr log -1 --format='%cs %s' | cut -c1-100))"
          echo "### Zephyr $ZREV \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          pip install -q -r zephyr/scripts/requirements-base.txt -r zephyr/scripts/requirements-build-test.txt -r zephyr/scripts/requirements-run-test.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Zephyr SDK (version from the tree, checksums from the release)
        run: |
          V=$(tr -d '[:space:]' < zephyr/SDK_VERSION)
          [ -n "$V" ] || { echo "::error::no SDK_VERSION in the Zephyr tree"; exit 1; }
          BASE=https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v$V
          MIN=zephyr-sdk-${V}_linux-x86_64_minimal.tar.xz
          TC=toolchain_gnu_linux-x86_64_aarch64-zephyr-elf.tar.xz
          echo "Zephyr SDK required by main: $V"
          echo "$V" > "$OUT/sdk.txt"; echo "SDK \`$V\`" >> "$GITHUB_STEP_SUMMARY"
          cd /opt
          sudo wget -q "$BASE/sha256.sum" "$BASE/$MIN" "$BASE/$TC"
          # Verify against the release's own checksum file; both files MUST be listed.
          grep -E " \*?($MIN|$TC)\$" sha256.sum > wanted.sum
          [ "$(wc -l < wanted.sum)" = 2 ] || { echo "::error::sha256.sum does not list both $MIN and $TC"; exit 1; }
          sha256sum -c wanted.sum
          sudo tar xf "$MIN"
          sudo mkdir -p zephyr-sdk-$V/gnu
          sudo tar xf "$TC" -C zephyr-sdk-$V/gnu
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-$V" >> "$GITHUB_ENV"
      - name: Unit tests (fake virtio transport, qemu_cortex_a53)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          zephyr/scripts/twister -T zephyr-virtio-can/tests -p qemu_cortex_a53 --inline-logs -v \
            --outdir twister-tests 2>&1 | tee "$OUT/twister-tests.log"
      - name: Gate unit tests
        if: always()
        run: |
          cp twister-tests/twister.json "$OUT/twister-tests.json" 2>/dev/null || true
          python3 -I zephyr-virtio-can/.github/scripts/twister_gate.py "$OUT/twister-tests.json" \
            --rc "${{ steps.tests.outcome == 'success' && '0' || '1' }}" \
            --suites "$EXPECT_TEST_CONFIGS" --cases "$EXPECT_TEST_CASES" --first-failure "$OUT/first-failure.txt"
      - name: Build the Xen self-test sample (xenvm)
        id: sample
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          zephyr/scripts/twister -T zephyr-virtio-can/samples -p xenvm --build-only --inline-logs -v \
            --outdir twister-sample 2>&1 | tee "$OUT/twister-sample.log"
      - name: Gate sample build
        if: always()
        run: |
          cp twister-sample/twister.json "$OUT/twister-sample.json" 2>/dev/null || true
          python3 -I zephyr-virtio-can/.github/scripts/twister_gate.py "$OUT/twister-sample.json" \
            --rc "${{ steps.sample.outcome == 'success' && '0' || '1' }}" \
            --suites "$EXPECT_SAMPLE_CONFIGS" --build-only --first-failure "$OUT/first-failure.txt"
      - name: Collect
        if: always()
        run: |
          [ "${{ job.status }}" = success ] && echo pass > "$OUT/result" || echo fail > "$OUT/result"
          # Last lines: of the log that failed, else of any log; plus the first compile error.
          { grep -h -m1 -E "error:" "$OUT"/twister-*.log 2>/dev/null | head -1 | sed 's/^.*zephyr-virtio-can\/zephyr-virtio-can\///; s/^/first error: /'
            for f in "$OUT"/twister-sample.log "$OUT"/twister-tests.log; do [ -f "$f" ] && { echo "--- $(basename $f)"; tail -n 20 "$f"; }; done
          } > "$OUT/tail.txt"
          [ -s "$OUT/first-failure.txt" ] || grep -h -m1 -E "error:|FAILED" "$OUT"/twister-*.log > "$OUT/first-failure.txt" 2>/dev/null || true
          cp zephyr-virtio-can/west-main.yml "$OUT/" 2>/dev/null || true
          find twister-tests twister-sample -name build.log -size -2M -exec sh -c 'for f; do d=$(echo "$f" | tr / _); cp "$f" "$OUT/$d"; done' _ {} + 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zephyr-main-logs
          path: ci-out/
          retention-days: 14
          if-no-files-found: warn

  # Tracking issue. Separate job so only it holds issues: write. Scheduled runs act;
  # a manual dispatch only prints what it would do.
  report:
    needs: main
    if: always() && (github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: zephyr-main-weekly-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: zephyr-main-logs
          path: ci-out
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'schedule' && '0' || '1' }}
          JOB_RESULT: ${{ needs.main.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_RESULT" = cancelled ] || [ "$JOB_RESULT" = skipped ]; then
            echo "job was $JOB_RESULT: no verdict, leaving the tracking issue alone"; exit 0
          fi
          R=$(cat ci-out/result 2>/dev/null || echo fail)   # no verdict file = never got that far = fail
          echo "job result $JOB_RESULT, verdict $R, dry run $DRY_RUN"
          .github/scripts/main-weekly-issue.sh "$R" "$RUN_URL" ci-out
